# Usage figures for the cost report. They do not stop a task.
schema_version: 1
levels:
  monthly_platform_usd: 50
  per_project_usd: 10
  per_task:
    input_tokens: 200000
    output_tokens: 40000
    tool_calls: 60
    retries: 2
    wall_clock_minutes: 45
alerts:
  spend_fraction: [0.5, 0.8, 1.0]
  anomaly: "task cost more than 3x the task-class median"
# Routes are chosen from measured benchmarks (evals/cost-benchmarks/). Placeholder until benchmarks exist.
