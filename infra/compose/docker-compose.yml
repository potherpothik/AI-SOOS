# Local development services. Credentials here are for local use only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aisoos
      POSTGRES_PASSWORD: aisoos
      POSTGRES_DB: aisoos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aisoos-local
      MINIO_ROOT_PASSWORD: aisoos-local-change-me
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
