[project]
name = "ai-soos"
version = "0.1.0"
description = "AI Software Orchestration Operating System: a controlled software factory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "httpx>=0.27",
    "litellm>=1.50",
    "langgraph>=0.2",
    "opentelemetry-sdk>=1.27",
    "playwright>=1.47",
    "pyyaml>=6",
]

[project.optional-dependencies]
security = [
    "semgrep>=1.90",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services/platform-api"]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"services/platform-api/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/platform-api/app"]

[tool.pytest.ini_options]
testpaths = ["services/platform-api/tests"]
pythonpath = ["services/platform-api"]
