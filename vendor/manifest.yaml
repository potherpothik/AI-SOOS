  - {name: taste-skill, url: "https://github.com/Leonxlnx/taste-skill", disposition: study, pin: "", reason: "Frontend visual guidance; overlaps other design skills"}
  - {name: ui-ux-pro-max-skill, url: "https://github.com/nextlevelbuilder/ui-ux-pro-max-skill", disposition: study, pin: "", reason: "Design system and UX rules"}

  # ---- Models and routing ----
  - {name: colibri, url: "https://github.com/JustVugg/colibri", disposition: optional, pin: "", reason: "Local inference research; not a first-version dependency"}
  - {name: freellmapi, url: "https://github.com/tashfeenahmed/freellmapi", disposition: optional, pin: "", reason: "Evaluate privacy, reliability, and terms before any use; never for confidential code"}
