# Classification of the 75 supplied repositories (git-repositories.md, trending week of 2–9 Nov 2026).
#
# disposition:
#   install   - a package is installed into the project virtualenv (library or defensive tool)
#   binary    - a pinned release binary is installed into the security runner (defensive only)
#   study     - cloned read-only into vendor/reference/ for review; never built or executed
#   optional  - not needed for the core; add only for a specific product requirement
#   excluded  - not installed or cloned into the platform; see reason
#
# Installing or cloning is done only by scripts/setup.sh and scripts/fetch-reference-repos.sh.
# "pin" must be filled with a commit SHA after review; empty means not yet reviewed.

schema_version: 1
repositories:
  # ---- AIOS ----
  - {name: agent-desktop, url: "https://github.com/vercel-labs/agent-desktop", disposition: optional, pin: "", reason: "Desktop automation; only if a desktop workflow is required"}
  - {name: AIOS, url: "https://github.com/agiresearch/AIOS", disposition: study, pin: "", reason: "OS-style agent concepts (model, memory, tools, scheduling)"}
  - {name: CompanyOS, url: "https://github.com/kortix-ai/CompanyOS", disposition: study, pin: "", reason: "Multi-agent company/workspace concepts"}
  - {name: deepseek-harness, url: "https://github.com/deepseek-ai/deepseek-harness", disposition: study, pin: "", reason: "Composable harness and plugin architecture"}
  - {name: dsh-superagent-prototype, url: "https://github.com/deepseek-ai/dsh-superagent-prototype", disposition: study, pin: "", reason: "Autonomy concepts; not a platform component"}
  - {name: herdr, url: "https://github.com/herdrdev/herdr", disposition: study, pin: "", reason: "Agent runtime concepts"}
  - {name: orca, url: "https://github.com/stablyai/orca", disposition: study, pin: "", reason: "Fleet orchestration and workbench UX"}

  # ---- AI agents ----
  - {name: 500-AI-Agents-Projects, url: "https://github.com/ashishpatel26/500-AI-Agents-Projects", disposition: study, pin: "", reason: "Discovery catalogue only"}
  - {name: agent-autoloop, url: "https://github.com/KKKKhazix/agent-autoloop", disposition: optional, pin: "", reason: "Background task patterns; unbounded loops are not allowed"}
  - {name: Agent-Reach, url: "https://github.com/Panniantong/Agent-Reach", disposition: optional, pin: "", reason: "Scrapes social platforms that restrict automated access; confirm terms first"}
  - {name: agentswarms, url: "https://github.com/AgentSwarms-fyi/agentswarms", disposition: study, pin: "", reason: "Agent plus data-layer concepts"}
  - {name: andrej-karpathy-skills, url: "https://github.com/multica-ai/andrej-karpathy-skills", disposition: study, pin: "", reason: "Instruction-file pattern; copy only after license review"}
  - {name: claude-mem, url: "https://github.com/thedotmack/claude-mem", disposition: study, pin: "", reason: "npm package installs hooks into coding-agent configuration; review hooks before any install"}
  - {name: ECC, url: "https://github.com/affaan-m/ECC", disposition: study, pin: "", reason: "Large harness overlapping the platform runtime; do not install alongside another harness"}
  - {name: gstack, url: "https://github.com/garrytan/gstack", disposition: study, pin: "", reason: "Role-based engineering workflow"}
  - {name: OpenMausBot, url: "https://github.com/milind-soni/OpenMausBot", disposition: excluded, pin: "", reason: "Bots with virtual machines; outside software-factory scope"}
  - {name: ponytail, url: "https://github.com/DietrichGebert/ponytail", disposition: study, pin: "", reason: "Diff-minimisation review ideas for the reviewer checklist"}
  - {name: ragflow, url: "https://github.com/infiniflow/ragflow", disposition: optional, pin: "", reason: "Document RAG; run as a separate service only when retrieval needs it"}
  - {name: rea, url: "https://github.com/morluto/rea", disposition: excluded, pin: "", reason: "Reverse engineers third-party applications; conflicts with licenses and terms of service; no legitimate platform need"}
  - {name: sellbird, url: "https://github.com/ethanplusai/sellbird", disposition: excluded, pin: "", reason: "Automated cold outreach; anti-spam and data-protection obligations; separate product only"}
  - {name: skills (Anthropic), url: "https://github.com/anthropics/skills", disposition: study, pin: "", reason: "Skill format and examples"}
  - {name: skills (Matt Pocock), url: "https://github.com/mattpocock/skills", disposition: study, pin: "", reason: "TDD, review, diagnosis practices; pick one skills set to avoid overlap"}
  - {name: superpowers, url: "https://github.com/obra/superpowers", disposition: study, pin: "", reason: "Engineering workflow skills"}
  - {name: Tel-Agent, url: "https://github.com/Dpro-at/Tel-Agent", disposition: excluded, pin: "", reason: "Voice calling assistant; outside scope"}

  # ---- System architecture ----
  - {name: archify, url: "https://github.com/tt-a1i/archify", disposition: study, pin: "", reason: "Architecture diagram generation for the architect role"}
  - {name: auto-ontology, url: "https://github.com/NVIDIA/auto-ontology", disposition: study, pin: "", reason: "Governed database semantics"}
  - {name: graphify, url: "https://github.com/Graphify-Labs/graphify", disposition: install, pin: "", package: "pypi:graphifyy", reason: "Verified: PyPI package graphifyy lists this repository as source. Installs a skill for coding agents; review before enabling"}
  - {name: spec-kit, url: "https://github.com/github/spec-kit", disposition: install, pin: "", package: "pypi:specify-cli", reason: "Specification-first tooling; PyPI package specify-cli is part of GitHub Spec Kit"}
