  - {name: brag, url: "https://github.com/latent-spaces/brag", disposition: optional, pin: "", reason: "Separate product capability"}
  - {name: lemo-opuscar, url: "https://github.com/lemomo-ai/lemo-opuscar", disposition: optional, pin: "", reason: "Separate product capability"}
  - {name: MoneyPrinterTurbo, url: "https://github.com/harry0703/MoneyPrinterTurbo", disposition: optional, pin: "", reason: "Separate product capability"}

